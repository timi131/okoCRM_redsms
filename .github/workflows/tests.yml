name: tests

on:
  push:
  pull_request:

# Минимальные права для токена GITHUB_TOKEN
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Падение одной версии не отменяет проверку остальных
      fail-fast: false
      matrix:
        include:
          # Python 3.9 для ubuntu-latest (26.04) уже не собирают — проверяем на 24.04
          - {python: "3.9", os: ubuntu-24.04}
          - {python: "3.12", os: ubuntu-latest}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - run: python -W ignore -m unittest discover -s tests -v
      - run: python -m py_compile tools/simulate.py
      - run: docker build -t okocrm-redsms .
        if: matrix.python == '3.12'

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit bandit
      # Известные уязвимости в зависимостях
      - run: pip-audit -r requirements.txt
      # Статический анализ кода на типовые ошибки безопасности (средняя и высокая серьёзность)
      - run: bandit -r okocrm_redsms -ll
