name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -W ignore -m unittest discover -s tests -v
      - run: python -m py_compile tools/simulate.py
      - run: docker build -t okocrm-redsms .
        if: matrix.python == '3.12'
